name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
        sdk: [with-sdk, with-adapter, without-sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The live paths (auth, parallelism, receipts) run the real typesafe-sdk against a local
      # stand-in server. Without the SDK those tests skip, and the offline paths are tested alone.
      - if: matrix.sdk == 'with-sdk'
        run: pip install typesafe-sdk
      # The AUTOJEV_BACKEND=openai path runs the real system-one-adapter and openai SDK against a
      # stand-in OpenAI-compatible server (tests/fake_openai.py).
      - if: matrix.sdk == 'with-adapter'
        run: pip install typesafe-sdk 'system-one-adapter[openai]'
      - run: python -m unittest discover -s tests -v
